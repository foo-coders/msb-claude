[settings]
lockfile = true
minimum_release_age = "7d"

[tools]
"aqua:actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:zizmor" = "1.30.1"
hadolint = "2.15.1"
"npm:prettier" = "3.9.10"
trivy = "0.75.0"

[tasks.format]
description = "Format files with prettier"
run = "prettier --write ."

[tasks.lint]
depends = [ "lint:format", "lint:docker", "lint:github-action" ]

[tasks."lint:format"]
run = "prettier --check ."

[tasks."lint:docker:hadolint"]
description = "Lint Dockerfiles with hadolint"
run = "hadolint ubuntu-claude/Dockerfile"

[tasks."lint:docker:trivy"]
description = "Scan Dockerfiles for misconfigurations with trivy"
run = "trivy config --exit-code 1 ubuntu-claude/Dockerfile"

[tasks."lint:docker"]
description = "Lint Dockerfiles (hadolint + trivy config)"
depends = ["lint:docker:hadolint", "lint:docker:trivy"]

[tasks."lint:actionlint"]
run = "actionlint"

[tasks."lint:zizmor"]
run = "zizmor --persona pedantic .github"

[tasks."lint:github-action"]
depends = [ "lint:actionlint", "lint:zizmor" ]
