name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# Cancelling a push to main would leave that commit unlinted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          minimum_release_age: 7d
      - name: Check formatting
        run: mise run lint:format
      - name: Lint GitHub action
        run: mise run lint:github-action
      - name: Lint Dockerfile
        run: mise run lint:docker
      - name: Lint shell scripts
        run: mise run lint:shell
