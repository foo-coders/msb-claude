name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# Cancelling a push to main would leave that commit unlinted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - name: Check formatting
        run: mise run lint:format
      - name: Lint GitHub action
        run: mise run lint:github-action
      - name: Lint Dockerfile
        run: mise run lint:docker
