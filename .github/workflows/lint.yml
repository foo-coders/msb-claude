name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# Cancelling a push to main would leave that commit unlinted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          minimum_release_age: 7d
      - name: Check formatting
        run: mise run lint:format
      - name: Lint GitHub action
        run: mise run lint:github-action
      - name: Lint Dockerfile
        run: mise run lint:docker
      - name: Lint shell scripts
        run: mise run lint:shell
