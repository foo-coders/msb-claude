name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# An edited title makes the check of the previous one obsolete.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # required for conventional-pr-title
    steps:
      - name: Check PR title
        uses: foo-coders/github-actions/actions/conventional-pr-title@conventional-pr-title/v1 # zizmor: ignore[unpinned-uses]
