name: Publish image

on:
  push:
    branches: [main]
    paths:
      - "ubuntu-claude/**"
      - ".trivyignore"
      - ".github/workflows/publish-image.yml"
  # rebuild weekly to pick up apt and Claude Code updates, which the Dockerfile tracks unpinned
  schedule:
    - cron: "30 4 * * 3"
  workflow_dispatch:

permissions: {}

# Publish and cleanup must not overlap on the same package, and a cancelled publish would skip a rebuild.
concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/foo-coders/ubuntu-claude

jobs:
  publish:
    name: Build, scan and push image
    runs-on: ubuntu-latest
    environment: main-automation
    permissions:
      contents: read # required for checkout
      packages: write # required to push to ghcr.io
      id-token: write # required for attest-build-provenance
      attestations: write # required for attest-build-provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          minimum_release_age: 7d
          # a publishing job must not restore tools from a cache another run could have written
          cache: false
      - name: Setup buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD'}}-{{sha}}
      # load into the local daemon to scan it before pushing
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ubuntu-claude
          load: true
          tags: ubuntu-claude # as expected by image:scan
          provenance: false
      - name: Scan image
        run: mise run --skip-deps image:scan
      - name: Upload full scan results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results
          path: trivy-results.json
          retention-days: 90
      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # rebuilds from the builder cache, reusing the scanned layers
      - name: Push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ubuntu-claude
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      # verifiable with `gh attestation verify`
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}

  cleanup:
    name: Prune old image versions
    needs: publish
    runs-on: ubuntu-latest
    environment: main-automation
    permissions:
      packages: write # required to delete package versions, along with the one-time package setup in CONTRIBUTING.md
    steps:
      - name: Prune old image versions
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          owner: foo-coders
          package: ubuntu-claude
          keep-n-tagged: 10
          delete-untagged: true
